name: Hungry slime texture
# One-off: recolors the vanilla slime texture red for the Hungry Slime and commits it.
on:
  push:
    paths:
      - .github/workflows/hungry-texture.yml
permissions:
  contents: write
jobs:
  recolor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recolor
        run: |
          pip install pillow
          manifest=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          version_url=$(echo "$manifest" | python3 -c "import json,sys; print(next(v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.1'))")
          client_url=$(curl -fsSL "$version_url" | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -fsSL "$client_url" -o "$RUNNER_TEMP/client.jar"
          unzip -p "$RUNNER_TEMP/client.jar" assets/minecraft/textures/entity/slime/slime.png > "$RUNNER_TEMP/slime.png"
          python3 tools/recolor_slime.py "$RUNNER_TEMP/slime.png" common/src/main/resources/assets/slimeranch/textures/entity/slime/hungry_slime.png 0
      - name: Commit
        run: |
          git config user.name "LuckyOwlStudios"
          git config user.email "205089326+LuckyOwlStudios@users.noreply.github.com"
          git add common/src/main/resources/assets/slimeranch/textures/entity/slime/hungry_slime.png
          git commit -m "Add the Hungry Slime texture, a red recolor of the vanilla slime" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ACHC6ieReYeKYKcZ1Ss7eB"
          git push
