name: Piston assets
# One-off: prints the vanilla piston models and creates the Bouncy Piston textures from them.
on:
  push:
    paths:
      - .github/workflows/piston-assets.yml
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and recolor
        run: |
          pip install pillow
          manifest=$(curl -fsSL https://piston-meta.mojang.com/mc/game/version_manifest_v2.json)
          version_url=$(echo "$manifest" | python3 -c "import json,sys; print(next(v['url'] for v in json.load(sys.stdin)['versions'] if v['id']=='1.21.1'))")
          client_url=$(curl -fsSL "$version_url" | python3 -c "import json,sys; print(json.load(sys.stdin)['downloads']['client']['url'])")
          curl -fsSL "$client_url" -o "$RUNNER_TEMP/client.jar"
          mkdir "$RUNNER_TEMP/v" && cd "$RUNNER_TEMP/v" && unzip -q "$RUNNER_TEMP/client.jar" 'assets/minecraft/blockstates/piston*' 'assets/minecraft/models/block/piston*' 'assets/minecraft/models/item/piston*' 'assets/minecraft/textures/block/piston*' && cd -
          for f in "$RUNNER_TEMP"/v/assets/minecraft/blockstates/piston.json "$RUNNER_TEMP"/v/assets/minecraft/models/block/piston*.json "$RUNNER_TEMP"/v/assets/minecraft/models/item/piston*.json; do echo "=== $f"; cat "$f"; echo; done
          ls "$RUNNER_TEMP"/v/assets/minecraft/textures/block/
          python3 tools/recolor_piston.py "$RUNNER_TEMP/v/assets/minecraft/textures/block" common/src/main/resources/assets/slimeranch/textures/block
      - name: Commit
        run: |
          git config user.name "LuckyOwlStudios"
          git config user.email "205089326+LuckyOwlStudios@users.noreply.github.com"
          git add common/src/main/resources/assets/slimeranch/textures/block
          git commit -m "Recolor the vanilla piston textures blue for the Bouncy Piston" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01ACHC6ieReYeKYKcZ1Ss7eB"
          git push
